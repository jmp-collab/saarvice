<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="SAARVICE Heavyweight Boxy Tee (280 GSM) mit Rückenprint: Hauptsach gudd. Awwer annersch.">
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262422"/>
      <stop offset="50%" stop-color="#191816"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e3b23c" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#d94f3d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e3b23c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f2ead8" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="500" height="500" fill="#12110f"/>
  <rect width="500" height="500" fill="url(#grid)"/>
  <rect width="500" height="500" fill="url(#glow)"/>

  <!-- Technical Spec Frame -->
  <rect x="18" y="18" width="464" height="464" fill="none" stroke="#e3b23c" stroke-opacity="0.25" stroke-width="1"/>
  <text x="32" y="40" font-family="monospace" font-size="10" fill="#e3b23c" letter-spacing="2">SPEC // SV-CAPSULE-001</text>
  <text x="468" y="40" font-family="monospace" font-size="10" fill="#f2ead8" fill-opacity="0.5" text-anchor="end" letter-spacing="1">280 GSM BIO-COTTON</text>

  <!-- Heavyweight Boxy Shirt Silhouette -->
  <path d="M168 88 L202 72 Q250 98 298 72 L332 88 L412 138 L372 204 L342 184 L342 426 Q250 436 158 426 L158 184 L128 204 L88 138 Z"
        fill="url(#shirt)" stroke="#e3b23c" stroke-width="1.8" stroke-opacity="0.65"/>
  <!-- Ribbed Collar -->
  <path d="M202 72 Q250 102 298 72" fill="none" stroke="#e3b23c" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M207 79 Q250 107 293 79" fill="none" stroke="#f2ead8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 2"/>

  <!-- Neck Label Tag -->
  <rect x="236" y="84" width="28" height="14" rx="1" fill="#0d0c0a" stroke="#e3b23c" stroke-width="0.8"/>
  <text x="250" y="94" font-family="'Archivo Black',sans-serif" font-size="7" fill="#e3b23c" text-anchor="middle">SV</text>

  <!-- Subtle Drape Lines -->
  <path d="M196 225 Q210 315 198 415" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="5"/>
  <path d="M304 225 Q290 315 302 415" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="5"/>

  <!-- Brass Stamp Emblem on Upper Back -->
  <circle cx="250" cy="155" r="22" fill="none" stroke="#e3b23c" stroke-width="2"/>
  <circle cx="250" cy="155" r="18" fill="none" stroke="#d94f3d" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="250" y="159" font-family="'Archivo Black',sans-serif" font-size="11" fill="#e3b23c" text-anchor="middle">0681</text>

  <!-- Main Back Print -->
  <text x="250" y="232" font-family="'Archivo Black','Barlow Condensed',sans-serif" font-size="31" font-weight="900"
        fill="#f2ead8" text-anchor="middle" letter-spacing="1">HAUPTSACH</text>
  <text x="250" y="268" font-family="'Archivo Black','Barlow Condensed',sans-serif" font-size="33" font-weight="900"
        fill="#e3b23c" text-anchor="middle" letter-spacing="1">GUDD.</text>
  <text x="250" y="306" font-family="'Archivo Black','Barlow Condensed',sans-serif" font-size="31" font-weight="900"
        fill="#f2ead8" text-anchor="middle" letter-spacing="1">AWWER</text>
  <text x="250" y="342" font-family="'Archivo Black','Barlow Condensed',sans-serif" font-size="31" font-weight="900"
        fill="#d94f3d" text-anchor="middle" letter-spacing="1">ANNERSCH.</text>

  <!-- Edition Stamp -->
  <rect x="195" y="365" width="110" height="22" rx="2" fill="none" stroke="#e3b23c" stroke-opacity="0.5"/>
  <text x="250" y="380" font-family="monospace" font-size="9" fill="#e3b23c" text-anchor="middle" letter-spacing="1.5">GUDD-GESS-EDITION</text>

  <text x="250" y="466" font-family="monospace" font-size="11" fill="#e3b23c" fill-opacity="0.85"
        text-anchor="middle" letter-spacing="2">SAARVICE STREETWEAR CAPSULE 2.0 • DROP #001</text>
</svg>
